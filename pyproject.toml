[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forwardbin"
version = "1.0.0"
description = "Your Linux Jarvis drop bin: AI-powered scheduling, slot reservation, and email alerts."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ForwardBin Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities"
]
dependencies = [
    "requests>=2.28.0",
    "pycairo>=1.20.0",
    "PyGObject>=3.42.0",
    "beautifulsoup4>=4.11.0",
    "python-dateutil>=2.8.0",
    "icalendar>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[project.scripts]
forwardbin-ui = "forwardbin.cli:main"

[tool.setuptools.packages.find]
include = ["forwardbin*"]
